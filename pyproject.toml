[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "streamstats"
version = "0.1.0"
description = "Пакет `streamstats`, читающий события из CSV и JSONL и создающий статистический отчёт."
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
streamstats = "streamstats.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]